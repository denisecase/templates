# ============================================================
# pyproject.toml (ALL-PY)
# ============================================================
# Updated: 2026-06-10
# REQ.PYTHON: Python projects SHOULD include pyproject.toml as the single source of truth.
# WHY: Centralizes Python tooling configuration even when the repo is not a package.

[project]
name = "templates"
version = "0.1.0"
readme = "README.md"
requires-python = ">=3.14"
license = "MIT"
authors = [{ name = "Denise Case" }]
description = "Canonical repository baseline templates and tooling checks."
dependencies = []

[project.optional-dependencies]
dev = ["pre-commit"]

docs = []

# ============================================================
# SECTION 2: TOOL CONFIGURATION
# ============================================================

[tool.uv]
# REQ: Disable package mode for tooling-only repositories.
# WHY: This repository is not intended to be built or published as a Python package.
package = false
